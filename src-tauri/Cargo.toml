[package]
name = "hush"
version = "0.1.0"
description = "hush — a calm, minimal music player"
authors = ["hush"]
edition = "2021"

[lib]
name = "hush_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "rt", "net", "io-util", "macros"] }
async-trait = "0.1"
gstreamer = "0.25"
discord-rich-presence = "1.1"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
hush-session-protocol = { path = "../hush-sync/protocol" }

# MPRIS is a Linux/D-Bus API. Keeping the crate target-scoped avoids pulling
# D-Bus into Windows and macOS builds.
[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = { version = "0.11", features = ["tokio"] }

# System Media Transport Controls (media overlay + hardware keys) on Windows.
[target.'cfg(target_os = "windows")'.dependencies]
souvlaki = "0.9"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
